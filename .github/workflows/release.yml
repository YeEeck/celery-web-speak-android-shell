name: 构建安卓客户端

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      CWS_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: 设置版本号
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::发布 Tag 必须使用 v1.2.3 形式的版本号"
              exit 1
            fi
            version_name="${GITHUB_REF_NAME#v}"
          else
            version_name="1.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "CWS_VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "APK_NAME=CeleryWebSpeak-${version_name}-android.apk" >> "$GITHUB_ENV"
      - name: 读取签名密钥
        shell: bash
        run: |
          for variable in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD
          do
            if [[ -z "${!variable}" ]]; then
              echo "::error::$variable GitHub Actions Secret 未配置"
              exit 1
            fi
          done
          keystore_path="$RUNNER_TEMP/celery-web-speak-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"
      - name: 检查并构建 Release APK
        run: ./gradlew lint test assembleRelease --stacktrace
      - name: 整理并验证 APK
        shell: bash
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/$APK_NAME"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$apksigner_path" ]]; then
            echo "::error::Android SDK 中未找到 apksigner"
            exit 1
          fi
          "$apksigner_path" verify --verbose "release/$APK_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-release
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
